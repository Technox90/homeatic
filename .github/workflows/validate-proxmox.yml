name: Validate Proxmox Installer

on:
  pull_request:
    paths:
      - "proxmox/**"
      - "dashboard/**"
      - ".github/workflows/validate-proxmox.yml"
  push:
    branches:
      - main
    paths:
      - "proxmox/**"
      - "dashboard/**"
      - ".github/workflows/validate-proxmox.yml"

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Master installer Bash syntax
        run: bash -n proxmox/proxmox.sh

      - name: Dashboard module Bash syntax
        run: bash -n proxmox/modules/dashboard.sh

      - name: Dashboard Python syntax
        run: python3 -m py_compile dashboard/collector.py dashboard/app.py

      - name: Updater tool Bash syntax
        run: |
          bash -n proxmox/tools/proxmox-auto-updater-config
          bash -n proxmox/tools/proxmox-pushover-config

      - name: V142 maintenance navigation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          text = Path("proxmox/proxmox.sh").read_text(encoding="utf-8")

          for choice in ("11", "20"):
              marker = f'if [[ "$INSTALL_SELECTION" == "{choice}" ]]; then'
              start = text.index(marker)
              end = text.index("\n    fi", start) + len("\n    fi")
              block = text[start:end]
              assert "continue" in block, f"choice {choice} must return to installer with continue"
              assert "exit 0" not in block, f"choice {choice} must not terminate the master installer"
          PY

      - name: Paperless direct NFS checks
        run: |
          grep -q 'PROXMOX MODULARER KOMPLETT-INSTALLER V145' proxmox/proxmox.sh
          grep -q 'PAPERLESS_NAS_MOUNT="/mnt/paperless-storage"' proxmox/proxmox.sh
          grep -q 'prepare_paperless_external_storage_v143() {' proxmox/proxmox.sh
          grep -q 'paperless_unprivileged=0' proxmox/proxmox.sh
          grep -q 'paperless_features="nesting=1,mount=nfs;nfs4"' proxmox/proxmox.sh
          grep -q 'RequiresMountsFor=$ct_mount' proxmox/proxmox.sh
          grep -q 'cleanup_legacy_paperless_host_mount_v143' proxmox/proxmox.sh
          if grep -q 'prepare_paperless_external_storage_v89' proxmox/proxmox.sh; then
            echo "Legacy PVE-host Paperless NFS setup is still referenced"
            exit 1
          fi
          if grep -q 'paperless_external_mp' proxmox/proxmox.sh; then
            echo "Legacy Paperless mp4 bind-mount logic is still present"
            exit 1
          fi
          if grep -q 'PAPERLESS_NAS_MOUNT="/mnt/paperless-nas"' proxmox/proxmox.sh; then
            echo "Legacy PVE-host Paperless mountpoint is still the active default"
            exit 1
          fi

      - name: AzuraCast extras module checks
        run: |
          bash -n proxmox/modules/azuracast.sh
          bash -n proxmox/modules/azuracast-config.sh
          bash -n proxmox/modules/azuracast-guest.sh
          python3 - <<'PY'
          from pathlib import Path
          p=Path('proxmox/proxmox.sh').read_text()
          guest=Path('proxmox/modules/azuracast-guest.sh').read_text()
          host=Path('proxmox/modules/azuracast.sh').read_text()
          dashboard=Path('proxmox/modules/dashboard.sh').read_text()
          required={
            'extras menu': '"AZURA" "EXTRAS · AzuraCast installieren',
            'management menu': '"AZURAMENU" "EXTRAS · AzuraCast verwalten',
            'standalone selection': 'AZURA)\n            INSTALL_AZURACAST=1',
            'optimal selection': 'OPTIMAL_RESET_PENDING=1',
            'guest storage preflight': 'INSTALL_AZURACAST',
            'capacity': 'OPTIMAL_STACK_DISK_GB_V107',
            'service install': 'install_azuracast_v145',
            'link': 'dashboard_link_upsert "AzuraCast"',
            'module loader': 'load_azuracast_module_v145',
          }
          for label, marker in required.items():
              assert marker in p, label
          assert '(( INSTALL_AZURACAST )) && total=$((total + 1))' in dashboard
          assert 'RequiresMountsFor=$AZURA_MEDIA_MOUNT' in guest
          assert 'nfs|smb|disk' in guest
          assert 'azuracast-smb.credentials' in guest
          assert 'azuracast-media.conf' in guest
          assert 'azuracast-default-sync.timer' in guest
          assert 'azuracast-media-check.timer' in guest
          config=Path('proxmox/modules/azuracast-config.sh').read_text()
          for mode in ('nfs','smb','local','disk'):
              assert mode in config
          assert 'get_cpu_cores' in config
          assert 'get_ram_mb' in config
          assert 'get_disk_gb' in config
          assert 'azura_configure_v145' in p
          assert 'AZURA_MEDIA_DISK_STORAGE' in p
          assert "azura_check_id_v145" in host
          assert "qm destroy 110" not in host
          assert "pct destroy 110" not in host
          PY

      - name: AzuraCast menu and storage mode smoke tests
        run: |
          bash <<'BASH'
          set -Eeuo pipefail
          . proxmox/modules/azuracast-config.sh
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          azura_config_file() { echo "$tmp/config"; }
          azura_note_v145() { :; }
          header() { :; }
          setup_profile_capture_value_v64() { :; }
          qm() { return 1; }
          pct() { return 1; }
          pvesm() {
            printf 'Name Type Status Total Used Available\nlocal-lvm lvmthin active 1000000 0 1000000\n'
          }
          get_cpu_cores() { echo 8; }
          get_ram_mb() { echo 8192; }
          get_disk_gb() { printf '%s\n' "$2"; }
          get_value() {
            if [[ "$1" == "AzuraCast IP/CIDR" ]]; then
              echo 192.168.178.150/24
            else
              printf '%s\n' "$2"
            fi
          }
          setup_profile_capture_value_v64() { :; }
          whiptail() { echo "$MODE"; }
          INSTALL_AZURACAST=1
          TUI_AVAILABLE=1
          OPTIMAL_INSTALL=0
          DISK_STORAGE=local-lvm
          GATEWAY=192.168.178.1
          for MODE in nfs local disk; do
            azura_configure_v145
            [[ "$AZURA_MEDIA_TYPE" == "$MODE" ]]
            [[ "$AZURA_CORES" -eq 8 ]]
            [[ "$AZURA_MEMORY" -eq 8192 ]]
            [[ "$AZURA_DISK" -eq 64 ]]
            [[ "$AZURA_CIDR" == 192.168.178.150/24 ]]
            [[ -s "$tmp/config" ]]
            case "$MODE" in
              nfs)
                [[ "$AZURA_MEDIA_SERVER" == 192.168.178.20 ]]
                [[ "$AZURA_MEDIA_SHARE" == /volume1/music ]]
                ;;
              local)
                [[ "$AZURA_MEDIA_MOUNT" == /var/azuracast/stations/home/media ]]
                ;;
              disk)
                [[ "$AZURA_MEDIA_DISK_GB" -eq 500 ]]
                [[ "$AZURA_MEDIA_DISK_STORAGE" == local-lvm ]]
                ;;
            esac
          done
          OPTIMAL_INSTALL=1
          azura_configure_v145
          [[ "$AZURA_MEDIA_TYPE" == nfs ]]
          echo "AzuraCast media/resource selections: PASS"
          BASH

      - name: V144 home layout checks
        run: |
          grep -q 'BACKUP_ROOT="/home/backups"' proxmox/proxmox.sh
          grep -q 'DIAGNOSE_ROOT="/home/diagnose"' proxmox/proxmox.sh
          grep -q 'NODEZERO_DOWNLOAD_DIR="/home/downloads"' proxmox/proxmox.sh
          grep -q 'NODEZERO_IMAGE_DIR="/home/img"' proxmox/proxmox.sh
          grep -q 'NODEZERO_SECRET_DIR="/root/passwort"' proxmox/proxmox.sh
          grep -q 'NODEZERO_SECRET_BACKUP_DIR="/home/passwort"' proxmox/proxmox.sh
          grep -q 'LOG_DIR="/home/diagnose/proxmox-auto-updater"' proxmox/proxmox.sh
          grep -q 'LOG_DIR="/home/diagnose/proxmox-auto-updater"' proxmox/tools/proxmox-auto-updater-config
          grep -q '/home/backups' proxmox/modules/dashboard.sh
          grep -q '/home/diagnose' proxmox/modules/dashboard.sh
          if grep -q '/root/backups' proxmox/modules/dashboard.sh; then
            echo "Dashboard module still writes backups below /root"
            exit 1
          fi
          if grep -q '/root/diagnose' proxmox/modules/dashboard.sh; then
            echo "Dashboard module still writes diagnostics below /root"
            exit 1
          fi
          grep -q '"/root/backups:$BACKUP_ROOT"' proxmox/proxmox.sh
          grep -q '"/root/diagnose:$DIAGNOSE_ROOT"' proxmox/proxmox.sh
          grep -q '"/root/downloads:$NODEZERO_DOWNLOAD_DIR"' proxmox/proxmox.sh

      - name: V141 installer checks
        run: |
          grep -q 'NODEZERO_SECRET_DIR="/root/passwort"' proxmox/proxmox.sh
          grep -q 'NODEZERO_SECRET_BACKUP_DIR="/home/passwort"' proxmox/proxmox.sh
          grep -q 'NODEZERO_DOWNLOAD_DIR="/home/downloads"' proxmox/proxmox.sh
          grep -q 'NODEZERO_IMAGE_DIR="/home/img"' proxmox/proxmox.sh
          grep -q 'NODEZERO_MODULE_REF="2e1d32da222f9207e9da124e982eb8b31e59a5ce"' proxmox/proxmox.sh
          grep -q 'load_nodezero_module_v140 "dashboard"' proxmox/proxmox.sh
          grep -q 'install_dashboard() {' proxmox/modules/dashboard.sh
          grep -q 'install_dashboard_settings_v4() {' proxmox/modules/dashboard.sh
          grep -q 'install_dashboard_layout_editor_v71() {' proxmox/modules/dashboard.sh
          grep -q 'validate_dashboard_final_state_v69() {' proxmox/modules/dashboard.sh
          grep -q 'local APP_DIR="/opt/nodezero/dashboard"' proxmox/modules/dashboard.sh
          if grep -q 'install_dashboard() {' proxmox/proxmox.sh; then
            echo "Dashboard definition still embedded in master installer"
            exit 1
          fi
          test -s dashboard/collector.py
          test -s dashboard/app.py
          test -s dashboard/index.html
          grep -q '"20" "Pushover · Empfänger / Test / Ein-Aus"' proxmox/proxmox.sh
          grep -q 'TOOLS_REF="a573f593f3134fc0f0feff7cc550cad6c5913175"' proxmox/proxmox.sh
          grep -q 'proxmox-pushover-config' proxmox/proxmox.sh
          grep -q 'AUTO_UPDATE_TIME' proxmox/tools/proxmox-auto-updater-config
          grep -q 'DROPIN_DIR="/etc/systemd/system/${TIMER}.d"' proxmox/tools/proxmox-auto-updater-config
          test "$(wc -c < proxmox/proxmox.sh)" -lt 700000
