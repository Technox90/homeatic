name: Validate Proxmox Installer

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - fix/paperless-domain-persistence
    paths:
      - "proxmox/**"
      - "dashboard/**"
      - ".github/workflows/validate-proxmox.yml"

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Master installer Bash syntax
        run: bash -n proxmox/proxmox.sh

      - name: Dashboard module Bash syntax
        run: bash -n proxmox/modules/dashboard.sh

      - name: Dashboard Python syntax
        run: python3 -m py_compile dashboard/collector.py dashboard/app.py

      - name: Updater tools Bash syntax
        run: |
          bash -n proxmox/tools/proxmox-auto-updater
          bash -n proxmox/tools/proxmox-auto-updater-config
          bash -n proxmox/tools/proxmox-pushover-config
          python3 -m py_compile proxmox/tools/proxmox-external-urls
          bash -n proxmox/tests/test-auto-updater.sh

      - name: Updater isolated regression tests
        run: bash proxmox/tests/test-auto-updater.sh

      - name: V156 managed component update offline checks
        run: |
          python3 -m py_compile proxmox/tools/proxmox-managed-updates
          python3 - <<'PY'
          from pathlib import Path
          from importlib.machinery import SourceFileLoader
          import importlib.util
          p = Path("proxmox/tools/proxmox-managed-updates")
          loader = SourceFileLoader("managed", str(p))
          spec = importlib.util.spec_from_loader(loader.name, loader)
          m = importlib.util.module_from_spec(spec)
          loader.exec_module(m)
          master = Path("proxmox/proxmox.sh").read_text()
          assert m.version(master.encode()) >= 156
          assert "proxmox-installer-update" in m.extract(master, 'js="""(() => {\n', '})();"""')
          assert "/api/status-page/heartbeat/" in m.extract(master, 'cat > "$tmp" <<\'KUMA_STATUS_HTML\'\n', '\nKUMA_STATUS_HTML\n')
          begin = "/* PVE_DASHBOARD_BRANDING_V154_BEGIN */"
          end = "/* PVE_DASHBOARD_BRANDING_V154_END */"
          index = "<html><head><style>" + begin + "old css" + end + "</style></head><body><img src='/assets/logo.png'><script defer src=\"/installer-update-v155.js\">" + begin + "old js" + end + "</script><script defer src=\"/installer-update-v155.js\"></script></body></html>"
          css = Path("dashboard/branding-v154.css").read_text()
          js = Path("dashboard/branding-v154.js").read_text()
          result = m.dashboard_payload(index, css, js)
          assert css in result and js in result
          assert "<img src='/assets/logo.png'>" in result
          assert m.dashboard_payload(result, css, js) == result
          assert result.count('<script defer src="/installer-update-v155.js"></script>') == 1
          assert '<script id="proxmox-branding">\n' + begin in result
          assert '<script defer src="/installer-update-v155.js">' + begin not in result
          module = Path("proxmox/modules/dashboard.sh").read_text()
          fn = module.split("install_dashboard_branding_v154() {", 1)[1].split("\n}\n", 1)[0]
          assert 'html.rfind("</script>")' not in fn
          assert '<script id="proxmox-branding">' in fn
          runtime = Path("dashboard/views/runtime.js").read_text()
          assert 'badge.remove()' in runtime
          assert 'container.append(badge)' not in runtime
          try:
              m.dashboard_payload("<html>unmanaged</html>", css, js)
          except ValueError:
              pass
          else:
              raise AssertionError("unmanaged dashboard must be rejected")
          assert 'install_proxmox_tool_v141 "proxmox-managed-updates"' in master
          updater = Path("proxmox/tools/proxmox-auto-updater").read_text()
          config = Path("proxmox/tools/proxmox-auto-updater-config").read_text()
          assert "\nupdate_proxmox_components_v156\n" in updater
          assert "5) configure_proxmox_updates_v156 ;;" in config
          PY

      - name: V142 maintenance navigation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          text = Path("proxmox/proxmox.sh").read_text(encoding="utf-8")

          for choice in ("11", "20"):
              marker = f'if [[ "$INSTALL_SELECTION" == "{choice}" ]]; then'
              start = text.index(marker)
              end = text.index("\n    fi", start) + len("\n    fi")
              block = text[start:end]
              assert "continue" in block, f"choice {choice} must return to installer with continue"
              assert "exit 0" not in block, f"choice {choice} must not terminate the master installer"
          PY

      - name: Paperless direct NFS checks
        run: |
          grep -Eq '^# PROXMOX MODULARER KOMPLETT-INSTALLER V[0-9]+$' proxmox/proxmox.sh
          grep -q 'PAPERLESS_NAS_MOUNT="/mnt/paperless-storage"' proxmox/proxmox.sh
          grep -q 'prepare_paperless_external_storage_v143() {' proxmox/proxmox.sh
          grep -q 'paperless_unprivileged=0' proxmox/proxmox.sh
          grep -q 'paperless_features="nesting=1,mount=nfs;nfs4"' proxmox/proxmox.sh
          grep -q 'RequiresMountsFor=$ct_mount' proxmox/proxmox.sh
          grep -q 'cleanup_legacy_paperless_host_mount_v143' proxmox/proxmox.sh
          if grep -q 'prepare_paperless_external_storage_v89' proxmox/proxmox.sh; then
            echo "Legacy PVE-host Paperless NFS setup is still referenced"
            exit 1
          fi
          if grep -q 'paperless_external_mp' proxmox/proxmox.sh; then
            echo "Legacy Paperless mp4 bind-mount logic is still present"
            exit 1
          fi
          if grep -q 'PAPERLESS_NAS_MOUNT="/mnt/paperless-nas"' proxmox/proxmox.sh; then
            echo "Legacy PVE-host Paperless mountpoint is still the active default"
            exit 1
          fi

      - name: V144 home layout checks
        run: |
          grep -q 'BACKUP_ROOT="/home/backups"' proxmox/proxmox.sh
          grep -q 'DIAGNOSE_ROOT="/home/diagnose"' proxmox/proxmox.sh
          grep -q 'PROXMOX_DOWNLOAD_DIR="/home/downloads"' proxmox/proxmox.sh
          grep -q 'PROXMOX_IMAGE_DIR="/home/img"' proxmox/proxmox.sh
          grep -q 'PROXMOX_SECRET_DIR="/root/passwort"' proxmox/proxmox.sh
          grep -q 'PROXMOX_SECRET_BACKUP_DIR="/home/passwort"' proxmox/proxmox.sh
          grep -q 'LOG_DIR="/home/diagnose/proxmox-auto-updater"' proxmox/tools/proxmox-auto-updater
          grep -q 'LOG_DIR="/home/diagnose/proxmox-auto-updater"' proxmox/tools/proxmox-auto-updater-config
          grep -q '/home/backups' proxmox/modules/dashboard.sh
          grep -q '/home/diagnose' proxmox/modules/dashboard.sh
          if grep -q '/root/backups' proxmox/modules/dashboard.sh; then
            echo "Dashboard module still writes backups below /root"
            exit 1
          fi
          if grep -q '/root/diagnose' proxmox/modules/dashboard.sh; then
            echo "Dashboard module still writes diagnostics below /root"
            exit 1
          fi
          grep -q '"/root/backups:$BACKUP_ROOT"' proxmox/proxmox.sh
          grep -q '"/root/diagnose:$DIAGNOSE_ROOT"' proxmox/proxmox.sh
          grep -q '"/root/downloads:$PROXMOX_DOWNLOAD_DIR"' proxmox/proxmox.sh

      - name: V154 logo menu visual polish
        run: |
          grep -q 'Dashboard Toolbar V154' dashboard/branding-v154.css
          grep -q 'Dashboard Toolbar V154' dashboard/branding-v154.js
          grep -q 'border:0!important' dashboard/branding-v154.css
          grep -q 'background:transparent!important' dashboard/branding-v154.css
          grep -q 'max-width:350px;max-height:60px' dashboard/branding-v154.css
          grep -q 'brandMenuToggle' dashboard/branding-v154.js
          grep -q 'install_dashboard_branding_v154() {' proxmox/modules/dashboard.sh
          grep -q 'PVE_DASHBOARD_BRANDING_V154' proxmox/modules/dashboard.sh

      - name: Toolbar layout regression
        run: |
          grep -q 'Dashboard Toolbar V154' dashboard/branding-v154.css
          grep -q 'Dashboard Toolbar V154' dashboard/branding-v154.js
          grep -q 'grid-template-columns:minmax(180px,1fr) auto minmax(180px,1fr)' dashboard/branding-v154.css
          grep -q 'brandMenuToggle' dashboard/branding-v154.js
          grep -q 'toggleBrandMenu' dashboard/branding-v154.js
          grep -q 'toolbarCenter' dashboard/branding-v154.js
          grep -q 'toolbarRight' dashboard/branding-v154.js
          grep -q '#sideNav .navHead{display:none!important}' dashboard/branding-v154.css
          grep -q 'install_dashboard_branding_v154() {' proxmox/modules/dashboard.sh
          grep -q 'PVE_DASHBOARD_BRANDING_V154' proxmox/modules/dashboard.sh

          python3 - <<'PY'
          from pathlib import Path
          js=Path("dashboard/branding-v154.js").read_text(encoding="utf-8")
          css=Path("dashboard/branding-v154.css").read_text(encoding="utf-8")
          assert "left.appendChild(menu)" in js
          assert "center.appendChild(live)" in js
          assert "center.appendChild(ups)" in js
          assert "right.appendChild(reboot)" in js
          assert "right.appendChild(shutdown)" in js
          assert "button.onclick=toggleBrandMenu" in js
          assert "z-index:130" in css
          PY

      - name: V152 in-place dashboard update path
        run: |
          grep -q '^prepare_dashboard_update_mode_v152() {' proxmox/modules/dashboard.sh
          grep -q '^dashboard_has_current_state_v152() {' proxmox/modules/dashboard.sh
          grep -q 'DASHBOARD_FAST_UPDATE_V152' proxmox/modules/dashboard.sh
          grep -q 'kein Rücksetzen auf V139-Basis' proxmox/modules/dashboard.sh
          grep -q 'prepare_dashboard_update_mode_v152' proxmox/proxmox.sh
          grep -q 'historische UI-Migrationen V53–V81 übersprungen' proxmox/proxmox.sh

          python3 - <<'PY'
          from pathlib import Path

          import re
          master=Path("proxmox/proxmox.sh").read_text(encoding="utf-8")
          module=Path("proxmox/modules/dashboard.sh").read_text(encoding="utf-8")

          assert re.search(r"(?m)^# PROXMOX MODULARER KOMPLETT-INSTALLER V\d+$", master)
          assert 'if (( DASHBOARD_FAST_UPDATE_V152 )); then' in module
          assert 'install_proxmox_dashboard_sources_v139 "$APP_DIR" "$STATIC_DIR"' in module

          required=[
              "install_dashboard_extras",
              "install_dashboard_menu_sorting",
              "install_dashboard_router_domain_fix",
              "install_dashboard_router_top_link",
              "install_dashboard_menu_editor_v4",
              "install_dashboard_settings_v4",
              "install_dashboard_settings_hub_v42",
              "install_dashboard_categories_v42",
              "install_dashboard_category_assignment_v42",
              "install_dashboard_menu_cleanup_v42",
          ]
          for fn in required:
              needle=f"(( INSTALL_DASHBOARD && ! DASHBOARD_FAST_UPDATE_V152 )) && {fn}"
              assert needle in master, needle

          assert "(( INSTALL_DASHBOARD )) && install_dashboard_branding_v154" in master
          PY

      - name: V151 generic dashboard branding and image protection
        run: |
          grep -q '^prepare_dashboard_branding_v151() {' proxmox/modules/dashboard.sh
          grep -q '^install_dashboard_branding_v154() {' proxmox/modules/dashboard.sh
          grep -q 'prepare_dashboard_branding_v151' proxmox/proxmox.sh
          grep -q 'install_dashboard_branding_v154' proxmox/proxmox.sh
          grep -q 'Dashboard-Update: logo.png/favicon.png werden NICHT verändert' proxmox/modules/dashboard.sh
          grep -q 'DASHBOARD_BRANDING_NEW_V151' proxmox/modules/dashboard.sh
          grep -q '/opt/dashboard/static/assets/logo.png' proxmox/modules/dashboard.sh
          grep -q '/opt/dashboard/static/assets/favicon.png' proxmox/modules/dashboard.sh
          grep -q 'Dashboard Toolbar V154' dashboard/branding-v154.js
          grep -q 'Dashboard Toolbar V154' dashboard/branding-v154.css
          grep -q '/assets/logo.png' dashboard/branding-v154.js
          grep -q '/assets/favicon.png' dashboard/branding-v154.js
          grep -q 'dashboardFixedToolbar' dashboard/branding-v154.css
          grep -q 'PVE_DASHBOARD_BRANDING_V154' proxmox/modules/dashboard.sh

          test -s dashboard/assets/logo.png
          test -s dashboard/assets/favicon.png

          test ! -e dashboard/assets/logo-lt-wbh.png
          test ! -e dashboard/assets/favicon-lt-wbh.png
          test ! -e dashboard/branding-v150.js
          test ! -e dashboard/branding-v150.css

          python3 - <<'PY'
          from pathlib import Path
          import struct
          import zlib

          def assert_transparent_blank(path):
              data=Path(path).read_bytes()
              assert data[:8] == b"\x89PNG\r\n\x1a\n", path
              color_type=data[25]
              assert color_type in (4,6) or b"tRNS" in data, f"{path}: no alpha transparency"

              pos=8
              idat=b""
              width=height=None
              bit_depth=None
              while pos < len(data):
                  length=struct.unpack(">I",data[pos:pos+4])[0]
                  kind=data[pos+4:pos+8]
                  body=data[pos+8:pos+8+length]
                  if kind==b"IHDR":
                      width,height,bit_depth,color_type,_,_,_=struct.unpack(">IIBBBBB",body)
                  elif kind==b"IDAT":
                      idat += body
                  pos += 12+length

              assert bit_depth == 8 and color_type == 6, f"{path}: expected RGBA8 placeholder"
              raw=zlib.decompress(idat)
              stride=width*4
              prev=bytearray(stride)
              offset=0
              for _ in range(height):
                  ft=raw[offset]; offset+=1
                  row=bytearray(raw[offset:offset+stride]); offset+=stride
                  bpp=4
                  for i in range(stride):
                      a=row[i-bpp] if i>=bpp else 0
                      b=prev[i]
                      cc=prev[i-bpp] if i>=bpp else 0
                      if ft==1: row[i]=(row[i]+a)&255
                      elif ft==2: row[i]=(row[i]+b)&255
                      elif ft==3: row[i]=(row[i]+((a+b)//2))&255
                      elif ft==4:
                          p=a+b-cc
                          pa=abs(p-a); pb=abs(p-b); pc=abs(p-cc)
                          pr=a if pa<=pb and pa<=pc else (b if pb<=pc else cc)
                          row[i]=(row[i]+pr)&255
                      elif ft!=0:
                          raise AssertionError(f"{path}: unsupported PNG filter {ft}")
                  assert all(row[i] == 0 for i in range(3,stride,4)), f"{path}: placeholder is not fully transparent"
                  prev=row

          assert_transparent_blank("dashboard/assets/logo.png")
          assert_transparent_blank("dashboard/assets/favicon.png")

          module=Path("proxmox/modules/dashboard.sh").read_text(encoding="utf-8")
          assert 'if (( DASHBOARD_BRANDING_NEW_V151 )); then' in module
          assert 'install -m 0644 -o root -g root "$cache/logo.png" "$logo_target"' in module
          assert 'install -m 0644 -o root -g root "$cache/favicon.png" "$favicon_target"' in module
          assert 'data["favicon_url"] = ""' not in module
          PY

      - name: Documentation version synchronization
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          master=Path("proxmox/proxmox.sh").read_text(encoding="utf-8")
          root=Path("README.md").read_text(encoding="utf-8")
          readme=Path("proxmox/README.md").read_text(encoding="utf-8")
          history=Path("proxmox/HISTORY.md").read_text(encoding="utf-8")
          history_txt=Path("proxmox/history.txt").read_text(encoding="utf-8")
          handoff=Path("proxmox/CHATGPT-HANDOFF.md").read_text(encoding="utf-8")

          match=re.search(r"PROXMOX MODULARER KOMPLETT-INSTALLER V(\d+)",master)
          assert match, "Installer version marker missing"
          version="V"+match.group(1)

          assert f"Aktueller Stand: {version}" in root
          assert f"Installationskandidat: {version}" in readme
          assert f"Aktueller Stand: {version}" in history
          assert f"Aktueller Installationskandidat: {version}" in handoff
          assert version in history_txt.splitlines()[3], "Newest history entry must be first"

          assert "proxmox/HISTORY.md" in root
          assert "HISTORY.md" in readme

          headings=re.findall(r"^\d{2}\.\d{2}\.\d{4} .*?V\d+.*$",history_txt,re.M)
          assert headings, "No version history headings found"
          for heading in headings:
              assert heading in history, f"Missing HISTORY.md entry: {heading}"

          newest=headings[0]
          assert version in newest, f"Newest history entry is not {version}: {newest}"
          PY

      - name: V149 Uptime Kuma external URL default
        run: |
          grep -q '("uptime", "Uptime Kuma", "up", True, False)' proxmox/tools/proxmox-external-urls
          if grep -q '("uptime", "Uptime Kuma", "uptime", True, False)' proxmox/tools/proxmox-external-urls; then
            echo "Uptime Kuma still defaults to uptime.<domain>"
            exit 1
          fi

      - name: V148 Stirling PDF registry checks
        run: |
          grep -q 'image: ghcr.io/stirling-tools/stirling-pdf:latest' proxmox/proxmox.sh
          if grep -q 'image: docker.stirlingpdf.com/stirlingtools/stirling-pdf:latest' proxmox/proxmox.sh; then
            echo "Stirling installer still uses docker.stirlingpdf.com"
            exit 1
          fi
          grep -q '^migrate_stirling_registry_v148() {' proxmox/tools/proxmox-auto-updater
          grep -q 'ghcr.io/stirling-tools/stirling-pdf' proxmox/tools/proxmox-auto-updater
          grep -q 'pre-v148-stirling-registry.bak' proxmox/tools/proxmox-auto-updater
          grep -q 'docker compose config -q' proxmox/tools/proxmox-auto-updater

      - name: V147 installer self-update checks
        run: |
          grep -Eq '^# PROXMOX MODULARER KOMPLETT-INSTALLER V[0-9]+$' proxmox/proxmox.sh
          grep -q '^proxmox_self_update_v147() {' proxmox/proxmox.sh
          grep -q 'raw.githubusercontent.com/Technox90/homeatic/refs/heads/main/proxmox/proxmox.sh' proxmox/proxmox.sh
          grep -q 'bash -n "$tmp"' proxmox/proxmox.sh
          grep -q 'cmp -s -- "$self" "$tmp"' proxmox/proxmox.sh
          grep -q '/home/backups/proxmox-installer-self-update' proxmox/proxmox.sh
          grep -q 'export PROXMOX_SELFUPDATE_DONE=1' proxmox/proxmox.sh
          grep -q 'exec /usr/bin/env bash "$self" "$@"' proxmox/proxmox.sh
          python3 - <<'PY'
          from pathlib import Path
          text = Path("proxmox/proxmox.sh").read_text(encoding="utf-8")
          update_fn = text.index("proxmox_self_update_v147() {")
          update_call = text.index('proxmox_self_update_v147 "$@"')
          menu = text.index('TUI_TITLE="PROXMOX INSTALLER V')
          assert update_fn < update_call < menu
          assert text.count("proxmox_self_update_v147() {") == 1
          assert text.count('proxmox_self_update_v147 "$@"') == 1
          PY

      - name: V146 logging, updater dedupe and external URL checks
        run: |
          grep -q 'LOG_DIR="/home/diagnose/pihole-language"' proxmox/proxmox.sh
          if grep -q 'LOGFILE="/root/pihole-sprache-' proxmox/proxmox.sh; then
            echo "Pi-hole language helper still writes new logs below /root"
            exit 1
          fi
          grep -q "find /root -maxdepth 1 -type f -name 'pihole-sprache-\*.txt'" proxmox/proxmox.sh
          grep -q 'install_proxmox_tool_v141 "proxmox-auto-updater"' proxmox/proxmox.sh
          if grep -q "cat > /usr/local/sbin/proxmox-auto-updater <<'__UPDATER__'" proxmox/proxmox.sh; then
            echo "Auto-Updater is still duplicated inside the master installer"
            exit 1
          fi
          grep -q '"5" "Externe URLs · Domain / Reverse Proxy / Let'"'"'s Encrypt"' proxmox/proxmox.sh
          grep -q 'install_proxmox_tool_v141 "proxmox-external-urls"' proxmox/proxmox.sh
          grep -q 'CONFIG_DIR = Path("/home/Data/proxmox-installer/external-urls")' proxmox/tools/proxmox-external-urls
          grep -q 'DIAG_DIR = Path("/home/diagnose/external-urls")' proxmox/tools/proxmox-external-urls
          grep -q 'backend = f"https://{hip}:8006"' proxmox/tools/proxmox-external-urls
          python3 - <<'PY'
          from pathlib import Path
          text = Path("proxmox/proxmox.sh").read_text(encoding="utf-8")
          marker = 'if [[ "$INSTALL_SELECTION" == "21" ]]; then'
          start = text.index(marker)
          end = text.index("\n    fi", start) + len("\n    fi")
          section = text[start:end]
          assert "proxmox-external-urls" in section
          assert "continue" in section
          assert "exit 0" not in section
          PY

      - name: V141 installer checks
        run: |
          grep -q 'PROXMOX_SECRET_DIR="/root/passwort"' proxmox/proxmox.sh
          grep -q 'PROXMOX_SECRET_BACKUP_DIR="/home/passwort"' proxmox/proxmox.sh
          grep -q 'PROXMOX_DOWNLOAD_DIR="/home/downloads"' proxmox/proxmox.sh
          grep -q 'PROXMOX_IMAGE_DIR="/home/img"' proxmox/proxmox.sh
          grep -q 'PROXMOX_MODULE_REF="a3df777b55821e7834b69fd389b46814f5f47256"' proxmox/proxmox.sh
          grep -q 'load_proxmox_module_v140 "dashboard"' proxmox/proxmox.sh
          grep -q 'install_dashboard() {' proxmox/modules/dashboard.sh
          grep -q 'install_dashboard_settings_v4() {' proxmox/modules/dashboard.sh
          grep -q 'install_dashboard_layout_editor_v71() {' proxmox/modules/dashboard.sh
          grep -q 'validate_dashboard_final_state_v69() {' proxmox/modules/dashboard.sh
          grep -q 'local APP_DIR="/opt/dashboard"' proxmox/modules/dashboard.sh
          if grep -q 'install_dashboard() {' proxmox/proxmox.sh; then
            echo "Dashboard definition still embedded in master installer"
            exit 1
          fi
          test -s dashboard/collector.py
          test -s dashboard/app.py
          test -s dashboard/index.html
          grep -q '"4" "Pushover · Empfänger / Test / Ein-Aus"' proxmox/proxmox.sh
          grep -Eq '^TOOLS_REF="[0-9a-f]{40}"$' proxmox/proxmox.sh
          grep -q 'proxmox-pushover-config' proxmox/proxmox.sh
          grep -q 'AUTO_UPDATE_TIME' proxmox/tools/proxmox-auto-updater-config
          grep -q 'DROPIN_DIR="/etc/systemd/system/${TIMER}.d"' proxmox/tools/proxmox-auto-updater-config
          test "$(wc -c < proxmox/proxmox.sh)" -lt 700000

      - name: V158 dashboard system footer
        run: |
          node --check dashboard/branding-v154.js
          python3 - <<'PY'
          from pathlib import Path
          js = Path("dashboard/branding-v154.js").read_text()
          css = Path("dashboard/branding-v154.css").read_text()
          assert "getElementById('hostinfo')" in js
          assert "proxmoxHostInfoHidden" in js and "proxmoxHostInfoHidden" in css
          assert "document.body.append(footer)" in js
          assert "Number.isSafeInteger(data.local)" in js
          assert "Version '+data.local" in js
          assert "Copyright © Technox1990" in js
          assert "https://github.com/Technox90/homeatic" in js
          PY

